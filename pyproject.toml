[project]
name = "utils-python"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "huangwenhua", email = "18675381281@163.com" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.2",
    "opencv-python>=4.13.0.92,<5",
    "PyX>=0.16",
    "reportlab>=4.4",
    "rosbags>=0.10.10,<0.11",
    "rosbags-image>=0.10.2,<0.11",
    "typer>=0.26.7,<0.27",
]

[project.scripts]
lovely_utils = "lovely_utils.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lovely_utils"]

# 与原先 Poetry 的 tuna 源一致，作为默认索引。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
